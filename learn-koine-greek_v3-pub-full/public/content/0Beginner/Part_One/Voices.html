﻿<h1>Verbal Voices Overview</h1>

<h2>Active Voice</h2>

<p>The <strong>subject performs the action</strong> of the verb. <em>act.</em></p>

<hr>

<h2>Middle Voice</h2>

<p>The <em>subject</em> performs the action <strong>upon themselves or in their own interest</strong>. <em>mid.</em></p>

<hr>

<h2>Passive Voice</h2>

<p>The <strong>subject is the recipient of the action</strong> performed by another. <em>pass.</em></p>
